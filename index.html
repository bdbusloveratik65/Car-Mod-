<script>

/* নিজের কোড এখানে দাও */

const secretCode = "ATIK2026";

function checkCode(){

const userCode =
document.getElementById("codeInput").value.trim();

if(userCode === secretCode){

document.getElementById("status").innerHTML =
"✔ Verification Success";

const btn =
document.getElementById("getLinkBtn");

btn.disabled = false;
btn.classList.add("active");

btn.onclick = function(){

window.open(
"https://www.mediafire.com/file/zqodavdnuutz0y5/Hiace_4_NICA.bussidmod/file",
"_blank"
);

};

}else{

document.getElementById("status").innerHTML =
"❌ Wrong Verification Code";

}

}

</script>
